  button.setAttribute('aria-label',[row.name, caption, '变体 '+(index+1)].join(' · '));
  button.onclick = () => start(group,row,side,pick(row,side));
  box.append(button);
  if (files.length > 1) {
    const dots = el('div','dots');
    dots.setAttribute('role','group');
    dots.setAttribute('aria-label',caption+'变体');
    files.forEach((file,i) => {
      const dot = el('button','dot');
      dot.setAttribute('aria-label',caption+'变体 '+(i+1)+' / '+files.length);
      dot.setAttribute('aria-pressed',String(i === index));
      dot.onclick = () => {
        choices.set(row.id+':'+side,i);
        [...dots.children].forEach((d,j) => d.setAttribute('aria-pressed',String(i===j)));
        button.setAttribute('aria-label',row.name+' · '+caption+' · 变体 '+(i+1));

    });
    box.append(dots);
  }
  return box;
}
function route() {
  group = groups.find(g => location.hash === '#group/' + g.id);
  $('home').hidden = Boolean(group);
  $('detail').hidden = !group;
  $('rows').replaceChildren();
  if (group) {
    $('category').textContent = group.section;
    $('title').textContent = group.name;
    $('summary').textContent = group.rows.length + (standalone(group) ? ' 项' : ' 个事件') + ' · 轻点圆点试听其他变体';
    for (const row of group.rows) {
      const article = el('article','row'), name = el('div','name');
      article.dataset.event = row.id;
      name.append(el('h2','',row.name));
      if (!standalone(group)) {
        if (!row.old.length) name.append(el('span','badge','新增'));
        else if (JSON.stringify(row.new) === JSON.stringify(row.old)) name.append(el('span','badge','未换'));
        name.append(el('code','',row.id));
      }
      article.append(name,sideControls(row,'new'));
      if (!standalone(group)) article.append(sideControls(row,'old'));
      $('rows').append(article);
    }
    $('title').focus({preventScroll:true});
  }
  updateButtons();
  window.scrollTo(0,0);
}
function updateButtons() {
  const live = state === 'playing' || state === 'loading';
  for (const row of $('rows').children) {
    const match = track && group === track.group && row.dataset.event === track.row.id;
    row.classList.toggle('active', Boolean(match));
    for (const btn of row.querySelectorAll('.play:not(:disabled)')) {
      const active = match && btn.dataset.side === track.side && live;
      btn.querySelector('.mark').textContent = active ? 'Ⅱ' : '▶';
      btn.setAttribute('aria-pressed',String(Boolean(active)));
    }
  }
  $('transport').disabled = !track;
  $('transport').firstElementChild.textContent = live ? 'Ⅱ' : '▶';
  $('transport').setAttribute('aria-label',live ? '暂停' : state === 'ended' ? '重播' : '播放');
}
function status(next, message) {
  state = next;
  $('state').textContent = message;
  $('state').classList.toggle('failure', next === 'error');
  updateButtons();
}
function progress() {
  const duration = audio.duration, time = audio.currentTime || 0;
  $('progress').value = Number.isFinite(duration) && duration > 0 ? Math.min(time/duration,1) : 0;
  $('clock').textContent = time.toFixed(2) + (Number.isFinite(duration) ? ' / '+duration.toFixed(2) : '') + ' s';
}
function animate() {
  progress();
  if (!audio.paused && !audio.ended) frame = requestAnimationFrame(animate);
}
function volume() {
  const value = Number($('vol').value)/100;
  if (gain) gain.gain.value = value;
  else audio.volume = value;
  audio.muted = value === 0;
  $('level').textContent = $('vol').value + '%';
}
// iOS versions that lock HTMLMediaElement.volume still allow a Web Audio gain
// control. Keep the native signal path on browsers with working element volume.
function unlockVolume() {
  if (soundContext) {
    if (soundContext.state !== 'running') soundContext.resume().catch(() => {});
    return;
  }
  if (!ios) return;
  const chosen = Number($('vol').value)/100;
  audio.volume = .47;
  const locked = Math.abs(audio.volume-.47) > .01;
  audio.volume = chosen;
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!locked || !Context) return;
  try {
    const ctx = new Context();
    soundContext = ctx;
    ctx.resume().then(() => {
      const node = ctx.createGain();
      node.connect(ctx.destination);
      ctx.createMediaElementSource(audio).connect(node);
      gain = node;
      volume();

function clearWait() { clearTimeout(timeout); }
function waitMessage(n) {
  clearWait();
  timeout = setTimeout(() => {
    if (n === attempt && state === 'loading')
      status('loading','正在等待音频数据，可暂停后重试');
  },8000);
}
function caption(t) {
  return (standalone(t.group) ? t.group.name : sides[t.side]) + ' · ' + (t.index+1) + '/' + t.row[t.side].length;
}
function start(g,row,side,index) {
  unlockVolume();
  if (track && track.group===g && track.row===row && track.side===side && track.index===index &&
      (state==='playing' || state==='loading' || state==='paused')) { transport(); return; }
  ++attempt;
  audio.pause();
  cancelAnimationFrame(frame);
  clearWait();
  track = {group:g,row,side,index,stem:row[side][index],format:0,failures:[]};
  $('now').textContent = g.name+' · '+row.name;
  $('progress').value = 0;
  $('clock').textContent = '0.00 s';
  if (!formats.length) { status('error','此浏览器未报告支持 AAC 或 Ogg'); return; }

}
function play(n) {

}
function loadFormat() {
  const n = ++attempt, fmt = formats[track.format];

  audio.src = track.url;

  waitMessage(n);
  play(n);
}
const errors = {1:'播放被中断',2:'网络读取失败',3:'音频解码失败',4:'无法读取文件或格式不受支持'};
function failed(n, reason) {
  if (!track || n !== attempt) return;
  ++attempt;
  clearWait();
  const current = track, url = current.url;
  current.failures.push(formats[current.format].toUpperCase()+' '+reason);
  if (++current.format < formats.length) { loadFormat(); return; }
  const token = attempt, message = current.failures.join(' / ');

  }).catch(() => { if (token===attempt) status('error',message+' · 网络不可达'); });
}
function transport() {
  if (!track) return;
  unlockVolume();
  if (state==='playing' || state==='loading') {
    ++attempt; clearWait(); audio.pause(); status('paused',caption(track)+' · 已暂停'); return;
  }
  if (state==='ended' || state==='error') {
    start(track.group,track.row,track.side,track.index); return;
  }
  const n = ++attempt;
  status('loading',caption(track)+' · 加载中');
  waitMessage(n); play(n);
}
audio.addEventListener('error',() => {
  if (track && audio.error && audio.src===track.url && state!=='error')
    failed(attempt,errors[audio.error.code] || '未知媒体错误');
});
audio.addEventListener('playing',() => {
  if (!track || audio.paused || audio.currentSrc!==track.url) return;
  clearWait(); status('playing',caption(track)+' · 播放中');
  cancelAnimationFrame(frame); animate();
});
audio.addEventListener('waiting',() => {
  if (track && !audio.paused && !audio.ended && state==='playing') {
    status('loading',caption(track)+' · 缓冲中'); waitMessage(attempt);
  }
});
audio.addEventListener('pause',() => {
  if (track && audio.paused && !audio.ended && state==='playing') {
    clearWait(); status('paused',caption(track)+' · 已暂停');
  }
});
audio.addEventListener('ended',() => {
  if (!track || !audio.ended || audio.currentSrc!==track.url) return;
  clearWait(); progress(); status('ended',caption(track)+' · 已播完');
});
audio.addEventListener('timeupdate', progress);
$('transport').onclick = transport;
$('vol').oninput = volume;
volume(); navigation(); route();
window.addEventListener('hashchange',route);
</script></body></html>
